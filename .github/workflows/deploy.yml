name: Deploy dev
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  build-deploy:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Validate backend
        working-directory: backend
        run: npm install && npm run build
      - name: Validate infrastructure
        working-directory: infra
        run: npm install && npm run build
      - name: Deploy infrastructure
        working-directory: infra
        run: npm run deploy -- --outputs-file cdk-outputs.json
      - name: Read CDK outputs
        id: cdk
        run: |
          for field in FrontendBucket CloudFrontDistributionId ApiUrl UserPoolId UserPoolClientId; do
            value=$(jq -r --arg field "$field" '.FiveMinutesDev[$field]' infra/cdk-outputs.json)
            echo "$field=$value" >> "$GITHUB_OUTPUT"
          done
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.cdk.outputs.ApiUrl }}
          VITE_COGNITO_POOL_ID: ${{ steps.cdk.outputs.UserPoolId }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.cdk.outputs.UserPoolClientId }}
        run: npm install && npm run build
      - name: Upload site
        run: aws s3 sync frontend/dist/ "s3://${{ steps.cdk.outputs.FrontendBucket }}/" --delete
      - name: Invalidate cache
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.cdk.outputs.CloudFrontDistributionId }}" --paths '/*'
